<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voto & Veto - Protótipo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card { transition: transform 0.3s, opacity 0.3s; }
        .swipe-left { transform: translateX(-150%) rotate(-20deg); opacity: 0; }
        .swipe-right { transform: translateX(150%) rotate(20deg); opacity: 0; }
        .gold-glow { box-shadow: 0 0 20px #ffd700; border: 2px solid #ffd700; }
    </style>
</head>
<body class="bg-gray-900 flex flex-col items-center justify-center min-h-screen font-sans p-4 text-white">

    <!-- Cabeçalho -->
    <div class="mb-6 text-center">
        <h1 class="text-2xl font-bold text-yellow-500">Voto & Veto</h1>
        <p class="text-gray-400 text-sm">Protótipo de Interface</p>
    </div>

    <!-- Área do Card -->
    <div id="card-container" class="relative w-full max-w-sm h-[500px]">
        <!-- O Card será inserido aqui via JavaScript -->
    </div>

    <!-- Barra de Decisão -->
    <div class="flex gap-6 mt-8">
        <button onclick="votar('veto')" class="bg-red-600 p-4 rounded-full w-16 h-16 flex items-center justify-center shadow-lg active:scale-90 transition">
            ✖️
        </button>
        <button onclick="votar('super')" class="bg-yellow-500 p-4 rounded-full w-20 h-20 flex items-center justify-center shadow-lg active:scale-90 transition border-4 border-yellow-300">
            🪙
        </button>
        <button onclick="votar('voto')" class="bg-green-600 p-4 rounded-full w-16 h-16 flex items-center justify-center shadow-lg active:scale-90 transition">
            ✔️
        </button>
    </div>

    <p id="feedback" class="mt-6 text-yellow-400 font-bold"></p>

    <script>
        const leis = [
            { id: 1, titulo: "Escala 6x1", resumo: "Fim da jornada de 6 dias de trabalho para 1 de folga.", autor: "Erika Hilton" },
            { id: 2, titulo: "Isenção IR 5k", resumo: "Ninguém que ganha até R$ 5.000 paga imposto de renda.", autor: "Executivo" },
            { id: 3, titulo: "PEC Blindagem", resumo: "Dificulta busca e apreensão contra parlamentares.", autor: "Congresso" }
        ];

        let index = 0;

        function carregarCard() {
            const container = document.getElementById('card-container');
            if (index >= leis.length) {
                container.innerHTML = `<div class="bg-gray-800 p-8 rounded-3xl h-full flex flex-col items-center justify-center text-center">
                    <h2 class="text-2xl mb-4">Fim dos Cards!</h2>
                    <button onclick="location.reload()" class="bg-blue-600 px-4 py-2 rounded">Reiniciar</button>
                </div>`;
                return;
            }

            const lei = leis[index];
            container.innerHTML = `
                <div id="main-card" class="card bg-white text-gray-900 p-6 rounded-3xl h-full shadow-2xl flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <span class="bg-yellow-100 text-yellow-800 text-xs font-bold px-2.5 py-0.5 rounded">PROJETO ${index + 1}</span>
                            <span class="text-gray-400 text-xs">Deslize para ver mais</span>
                        </div>
                        <h2 class="text-3xl font-black mb-2">${lei.titulo}</h2>
                        <p class="text-gray-600 text-sm mb-4">Autor: ${lei.autor}</p>
                        <hr class="mb-4">
                        <p class="text-lg leading-relaxed">${lei.resumo}</p>
                    </div>
                    <div class="bg-gray-100 p-4 rounded-2xl">
                        <p class="text-xs font-bold text-gray-500 mb-1 italic">DICA:</p>
                        <p class="text-sm">Use a Moeda de Ouro se este for um ponto inegociável para você.</p>
                    </div>
                </div>
            `;
        }

        function votar(tipo) {
            const card = document.getElementById('main-card');
            const feedback = document.getElementById('feedback');
            
            if (tipo === 'voto') {
                card.classList.add('swipe-right');
                feedback.innerText = "Você VOTOU SIM!";
            } else if (tipo === 'veto') {
                card.classList.add('swipe-left');
                feedback.innerText = "Você VETOU!";
            } else {
                card.classList.add('gold-glow');
                feedback.innerText = "MOEDA DE OURO ATIVADA!";
                setTimeout(() => card.classList.add('swipe-right'), 500);
            }

            setTimeout(() => {
                index++;
                feedback.innerText = "";
                carregarCard();
            }, 600);
        }

        carregarCard();
    </script>
</body>
</html>

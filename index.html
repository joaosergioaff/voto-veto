<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voto & Veto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card { transition: transform 0.35s ease, opacity 0.35s ease; }
        .swipe-left  { transform: translateX(-160%) rotate(-22deg); opacity: 0; }
        .swipe-right { transform: translateX(160%)  rotate(22deg);  opacity: 0; }
        .gold-glow   { box-shadow: 0 0 28px #ffd700; border: 3px solid #ffd700 !important; }
        .fade-out    { transition: opacity 0.35s ease; opacity: 0; }
        .skeleton { animation: pulse 1.4s infinite; background: #e5e7eb; border-radius: 6px; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .btn-pulse { animation: btn-pop 0.6s ease infinite alternate; }
        @keyframes btn-pop { from{transform:scale(1)} to{transform:scale(1.12)} }
    </style>
</head>
<body class="bg-gray-900 flex flex-col items-center justify-center min-h-screen font-sans p-4 text-white select-none">

    <div class="mb-5 text-center">
        <h1 class="text-2xl font-black text-yellow-400 tracking-wide">Voto & Veto</h1>
        <p id="status-text" class="text-gray-400 text-xs mt-1">Carregando projetos de lei...</p>
    </div>

    <div id="card-container" class="relative w-full max-w-sm" style="height:490px;"></div>

    <!-- Banner de Moeda de Ouro ativada -->
    <div id="gold-banner" class="hidden mt-4 bg-yellow-400 text-yellow-900 font-bold text-sm px-5 py-2 rounded-full shadow-lg text-center">
        🪙 Moeda de Ouro ativada — agora escolha ✔️ ou ✖️
    </div>

    <div class="flex gap-6 mt-4 items-center">
        <button id="btn-veto" onclick="acionar('veto')"
            class="bg-red-600 hover:bg-red-500 active:scale-90 transition p-4 rounded-full w-16 h-16 flex items-center justify-center shadow-lg text-2xl"
            title="Vetar">✖️</button>

        <button id="btn-ouro" onclick="acionar('ouro')"
            class="bg-yellow-400 hover:bg-yellow-300 active:scale-90 transition p-4 rounded-full w-20 h-20 flex items-center justify-center shadow-lg border-4 border-yellow-200 text-3xl"
            title="Moeda de Ouro">🪙</button>

        <button id="btn-abstencao" onclick="abster()"
            class="bg-gray-600 hover:bg-gray-500 active:scale-90 transition p-3 rounded-full w-12 h-12 flex items-center justify-center shadow-lg text-xl"
            title="Abster — decidir depois">⏭️</button>

        <button id="btn-voto" onclick="acionar('voto')"
            class="bg-green-600 hover:bg-green-500 active:scale-90 transition p-4 rounded-full w-16 h-16 flex items-center justify-center shadow-lg text-2xl"
            title="Votar a favor">✔️</button>
    </div>

    <p id="feedback" class="mt-5 text-yellow-300 font-bold text-lg h-6 text-center"></p>
    <p id="contador" class="text-gray-500 text-xs mt-2"></p>

    <script>
    // ── CONFIGURAÇÃO ────────────────────────────────────────────────────────
    const API_DIRETA  = 'https://dadosabertos.camara.leg.br/api/v2';
    const PROXY       = 'https://corsproxy.io/?';
    const TIPOS       = ['PL', 'PEC', 'MPV'];
    const ITENS       = 15;
    const LISTA_CURADA = [2485341, 2487436];

    let proposicoes   = [];
    let idx           = 0;
    let pagina        = 1;
    let carregando    = false;
    let ouroAtivado   = false;

    // ── LOCALSTORAGE ────────────────────────────────────────────────────────
    // Categorias: voto | veto | inegociavel_voto | inegociavel_veto
    function salvarVoto(prop, categoria) {
        const chave = 'vv_votos';
        const dados = JSON.parse(localStorage.getItem(chave) || '{}');
        const id    = String(prop.id);
        dados[id] = {
            titulo:    `${prop.siglaTipo} ${prop.numero}/${prop.ano}`,
            ementa:    prop.ementa || '',
            categoria: categoria,
            data:      new Date().toISOString()
        };
        localStorage.setItem(chave, JSON.stringify(dados));
    }

    // ── FETCH COM FALLBACK CORS ─────────────────────────────────────────────
    async function fetchComFallback(path) {
        const url = `${API_DIRETA}${path}`;
        try {
            const r = await fetch(url, { signal: AbortSignal.timeout(6000) });
            if (r.ok) return await r.json();
        } catch (_) {}

        // Fallback: proxy CORS
        const r = await fetch(PROXY + encodeURIComponent(url),
                              { signal: AbortSignal.timeout(8000) });
        if (!r.ok) throw new Error('proxy falhou');
        const txt = await r.text();
        try { return JSON.parse(txt); }
        catch (_) { return JSON.parse(JSON.parse(txt).contents); }
    }

    // ── LISTA CURADA ────────────────────────────────────────────────────────
    async function carregarCuradas() {
        const resultado = [];
        for (const id of LISTA_CURADA) {
            try {
                const json = await fetchComFallback(`/proposicoes/${id}`);
                if (json.dados) resultado.push(json.dados);
            } catch (_) {}
        }
        return resultado;
    }

    // ── CARREGAR PROPOSIÇÕES ────────────────────────────────────────────────
    async function carregarProposicoes() {
        if (carregando) return;
        carregando = true;
        mostrarSkeleton();

        try {
            const tipo = TIPOS[Math.floor(Math.random() * TIPOS.length)];
            const path = `/proposicoes?siglaTipo=${tipo}&itens=${ITENS}&pagina=${pagina}&ordem=DESC&ordenarPor=id`;
            const json = await fetchComFallback(path);

            if (!json.dados || json.dados.length === 0) {
                pagina = 1;
                carregando = false;
                return carregarProposicoes();
            }

            proposicoes = json.dados;
            idx    = 0;
            pagina++;
            atualizarStatus();
            renderizarCard();
        } catch (e) {
            mostrarErro();
        }
        carregando = false;
    }

    // ── RENDERIZAR CARD ─────────────────────────────────────────────────────
    function renderizarCard() {
        const container = document.getElementById('card-container');
        if (idx >= proposicoes.length) { carregarProposicoes(); return; }

        const p      = proposicoes[idx];
        const data   = p.dataApresentacao
            ? new Date(p.dataApresentacao).toLocaleDateString('pt-BR') : '–';
        const ementa     = p.ementa || 'Sem descrição disponível.';
        const ementaExib = ementa.length > 230 ? ementa.slice(0, 230) + '…' : ementa;

        const cores = {
            PL:  'bg-blue-100 text-blue-800',
            PEC: 'bg-yellow-100 text-yellow-800',
            MPV: 'bg-pink-100 text-pink-800',
            PDL: 'bg-green-100 text-green-800'
        };
        const cor = cores[p.siglaTipo] || 'bg-gray-100 text-gray-800';

        container.innerHTML = `
        <div id="main-card"
             class="card bg-white text-gray-900 rounded-3xl shadow-2xl flex flex-col justify-between"
             style="height:490px;padding:1.4rem;">

            <div>
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs font-bold px-2.5 py-1 rounded-full ${cor}">
                        ${p.siglaTipo} ${p.numero}/${p.ano}
                    </span>
                    <span class="text-gray-400 text-xs">${data}</span>
                </div>

                <h2 class="text-xl font-black leading-snug mb-3 text-gray-900">
                    ${p.siglaTipo} nº&nbsp;${p.numero} de ${p.ano}
                </h2>

                <hr class="mb-3 border-gray-200">

                <p class="text-gray-700 text-sm leading-relaxed">${ementaExib}</p>
            </div>

            <div>
                <a href="https://www.camara.leg.br/proposicoesWeb/fichadetramitacao?idProposicao=${p.id}"
                   target="_blank"
                   class="text-blue-500 text-xs underline block mb-3">
                   🔗 Ver tramitação completa na Câmara
                </a>
                <div class="bg-yellow-50 border border-yellow-200 p-3 rounded-2xl">
                    <p class="text-xs font-bold text-yellow-700 mb-0.5">💡 DICA</p>
                    <p class="text-xs text-yellow-800">
                        Use 🪙 se este projeto for um ponto <strong>inegociável</strong> para você —
                        depois confirme com ✔️ ou ✖️.
                    </p>
                </div>
            </div>
        </div>`;

        // Aplica glow se moeda já estava ativa ao trocar de card (não deve, mas por segurança)
        if (ouroAtivado) {
            document.getElementById('main-card').classList.add('gold-glow');
        }
    }

    function mostrarSkeleton() {
        document.getElementById('card-container').innerHTML = `
            <div class="bg-white rounded-3xl shadow-2xl flex flex-col gap-3 p-6" style="height:490px;">
                <div class="skeleton h-5 w-2/5"></div>
                <div class="skeleton h-8 w-4/5 mt-2"></div>
                <div class="skeleton h-4 w-full mt-4"></div>
                <div class="skeleton h-4 w-full"></div>
                <div class="skeleton h-4 w-3/4"></div>
                <div class="skeleton h-4 w-full"></div>
                <div class="skeleton h-4 w-5/6"></div>
                <div class="mt-auto skeleton h-16 w-full rounded-2xl"></div>
            </div>`;
        document.getElementById('status-text').innerText = 'Buscando projetos de lei...';
    }

    function mostrarErro() {
        document.getElementById('card-container').innerHTML = `
            <div class="bg-white rounded-3xl shadow-2xl flex flex-col items-center justify-center gap-4 p-8 text-center" style="height:490px;">
                <span class="text-4xl">⚠️</span>
                <h2 class="text-gray-800 font-bold text-lg">Não foi possível conectar à API da Câmara</h2>
                <p class="text-gray-500 text-sm">Verifique sua conexão e tente novamente.</p>
                <button onclick="carregarProposicoes()"
                    class="bg-blue-600 text-white px-6 py-2 rounded-full text-sm font-bold">
                    Tentar novamente
                </button>
            </div>`;
    }

    // ── MECÂNICA DA MOEDA DE OURO ──────────────────────────────────────────
    // Fluxo: [🪙] ativa modificador → usuário escolhe [✔️] ou [✖️]
    // Resultado: inegociavel_voto  ou  inegociavel_veto
    // Sem moeda:  voto  ou  veto

    function acionar(botao) {
        if (botao === 'ouro') {
            ativarOuro();
            return;
        }

        const card = document.getElementById('main-card');
        if (!card) return;

        const prop      = proposicoes[idx];
        const feedback  = document.getElementById('feedback');
        let categoria;

        if (ouroAtivado) {
            // Confirma o voto inegociável
            categoria = botao === 'voto' ? 'inegociavel_voto' : 'inegociavel_veto';
            feedback.innerText = botao === 'voto'
                ? '🪙✅ Inegociável — VOTOU A FAVOR!'
                : '🪙❌ Inegociável — VETOU!';
            desativarOuro();
        } else {
            categoria = botao; // 'voto' ou 'veto'
            feedback.innerText = botao === 'voto'
                ? '✅ Você VOTOU A FAVOR!'
                : '❌ Você VETOU!';
        }

        card.classList.add(botao === 'voto' ? 'swipe-right' : 'swipe-left');
        salvarVoto(prop, categoria);

        setTimeout(() => {
            idx++;
            feedback.innerText = '';
            atualizarStatus();
            renderizarCard();
        }, 500);
    }

    function abster() {
        const card    = document.getElementById('main-card');
        const feedback = document.getElementById('feedback');
        if (!card) return;

        const prop = proposicoes[idx];
        salvarVoto(prop, 'abstencao');
        feedback.innerText = '⏭️ Adiado para depois!';

        card.classList.add('fade-out');

        setTimeout(() => {
            idx++;
            feedback.innerText = '';
            atualizarStatus();
            renderizarCard();
        }, 400);
    }

    function ativarOuro() {
        if (ouroAtivado) { desativarOuro(); return; }   // segundo clique cancela
        ouroAtivado = true;

        const card = document.getElementById('main-card');
        if (card) card.classList.add('gold-glow');

        document.getElementById('gold-banner').classList.remove('hidden');
        document.getElementById('feedback').innerText = '';

        // Destaca os botões ✔️ e ✖️ para guiar o usuário
        document.getElementById('btn-voto').classList.add('btn-pulse');
        document.getElementById('btn-veto').classList.add('btn-pulse');
        document.getElementById('btn-ouro').classList.add('opacity-50');
    }

    function desativarOuro() {
        ouroAtivado = false;
        document.getElementById('gold-banner').classList.add('hidden');
        document.getElementById('btn-voto').classList.remove('btn-pulse');
        document.getElementById('btn-veto').classList.remove('btn-pulse');
        document.getElementById('btn-ouro').classList.remove('opacity-50');
    }

    // ── STATUS ───────────────────────────────────────────────────────────────
    function atualizarStatus() {
        document.getElementById('status-text').innerText =
            'Projetos de lei reais da Câmara dos Deputados';
        document.getElementById('contador').innerText =
            `${idx + 1} de ${proposicoes.length} neste lote`;
    }

    // ── INIT ────────────────────────────────────────────────────────────────
    async function iniciar() {
        mostrarSkeleton();
        const curadas = await carregarCuradas();
        if (curadas.length > 0) {
            proposicoes = curadas;
            idx = 0;
            atualizarStatus();
            renderizarCard();
        } else {
            carregarProposicoes();
        }
    }

    iniciar();
    </script>
</body>
</html>
